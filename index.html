<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Harian Pudyy ✧</title>
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons (Untuk icon yang estetik) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        bgSoft: '#F9F7F3', // Warna latar krem sangat lembut
                        cardBg: '#FFFFFF',
                        textMain: '#5A5A5A',
                        textMuted: '#9CA3AF',
                        // Palet Kategori
                        catRutinitas: '#EED3D9', // Soft Rose
                        catHobi: '#F5E8DD',      // Soft Peach
                        catPenting: '#CCD3CA',   // Soft Sage
                        catSantai: '#D4E2D4',    // Soft Mint
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: theme('colors.bgSoft');
            color: theme('colors.textMain');
            /* Custom scrollbar estetik */
            scrollbar-width: thin;
            scrollbar-color: #d1d5db transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 20px;
        }
        
        /* Animasi masuk untuk list */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .task-item {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* Glassmorphism ringan untuk header mobile */
        .glass-header {
            background: rgba(249, 247, 243, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex justify-center">

    <div class="w-full max-w-4xl min-h-screen flex flex-col md:flex-row relative">
        
        <!-- BAGIAN KIRI: Form Input & Profil -->
        <div class="w-full md:w-1/3 p-6 md:p-8 flex flex-col gap-8 md:sticky md:top-0 md:h-screen overflow-y-auto">
            
            <!-- Header / Profil -->
            <div class="text-center md:text-left mt-4 md:mt-0">
                <div class="inline-block p-1 rounded-full bg-gradient-to-tr from-catRutinitas to-catPenting mb-3">
                    <img src="https://api.dicebear.com/7.x/notionists/svg?seed=Pudyy&backgroundColor=transparent" alt="Pudyy Avatar" class="w-20 h-20 rounded-full bg-white p-1">
                </div>
                <h1 class="text-2xl font-semibold text-gray-800">Halo, Pudyy! ✨</h1>
                <p id="greetingText" class="text-sm text-textMuted mt-1">Selamat merencanakan harimu.</p>
            </div>

            <!-- Form Tambah Jadwal -->
            <div class="bg-cardBg rounded-3xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100">
                <h2 class="text-lg font-medium mb-4 flex items-center gap-2">
                    <i class="ph ph-plus-circle text-xl"></i> Buat Jadwal
                </h2>
                
                <form id="taskForm" class="flex flex-col gap-4">
                    <!-- Input Nama Kegiatan -->
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1 ml-1">Nama Kegiatan</label>
                        <input type="text" id="taskName" required placeholder="Misal: Baca buku, Coding..." 
                            class="w-full bg-gray-50 border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-catPenting outline-none transition-all placeholder:text-gray-400">
                    </div>

                    <!-- Input Waktu -->
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1 ml-1">Waktu</label>
                        <input type="time" id="taskTime" required 
                            class="w-full bg-gray-50 border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-catPenting outline-none transition-all text-gray-600">
                    </div>

                    <!-- Pilihan Kategori -->
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-2 ml-1">Kategori</label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="cursor-pointer relative">
                                <input type="radio" name="category" value="rutinitas" class="peer sr-only" checked>
                                <div class="px-3 py-2 rounded-xl text-xs font-medium text-center bg-gray-50 text-gray-500 peer-checked:bg-catRutinitas peer-checked:text-gray-800 transition-all border border-transparent peer-checked:border-white shadow-sm">
                                    Rutinitas
                                </div>
                            </label>
                            <label class="cursor-pointer relative">
                                <input type="radio" name="category" value="hobi" class="peer sr-only">
                                <div class="px-3 py-2 rounded-xl text-xs font-medium text-center bg-gray-50 text-gray-500 peer-checked:bg-catHobi peer-checked:text-gray-800 transition-all border border-transparent peer-checked:border-white shadow-sm">
                                    Hobi
                                </div>
                            </label>
                            <label class="cursor-pointer relative">
                                <input type="radio" name="category" value="penting" class="peer sr-only">
                                <div class="px-3 py-2 rounded-xl text-xs font-medium text-center bg-gray-50 text-gray-500 peer-checked:bg-catPenting peer-checked:text-gray-800 transition-all border border-transparent peer-checked:border-white shadow-sm">
                                    Penting
                                </div>
                            </label>
                            <label class="cursor-pointer relative">
                                <input type="radio" name="category" value="santai" class="peer sr-only">
                                <div class="px-3 py-2 rounded-xl text-xs font-medium text-center bg-gray-50 text-gray-500 peer-checked:bg-catSantai peer-checked:text-gray-800 transition-all border border-transparent peer-checked:border-white shadow-sm">
                                    Santai
                                </div>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="mt-2 w-full bg-gray-800 hover:bg-gray-700 text-white rounded-xl py-3 text-sm font-medium transition-all transform active:scale-95 shadow-md flex justify-center items-center gap-2">
                        <i class="ph-bold ph-paper-plane-tilt"></i> Tambahkan
                    </button>
                </form>
            </div>
            
            <div class="hidden md:block mt-auto text-xs text-center text-gray-400 pb-4">
                Dibuat untuk hari-hari estetik Pudyy ♡
            </div>
        </div>

        <!-- BAGIAN KANAN: Daftar Jadwal -->
        <div class="w-full md:w-2/3 p-6 md:p-8 bg-white/50 min-h-screen">
            
            <div class="flex justify-between items-end mb-6 sticky top-0 glass-header z-10 py-4 -mt-4">
                <div>
                    <h2 class="text-xl font-semibold text-gray-800">Timeline Hari Ini</h2>
                    <p id="currentDate" class="text-sm text-textMuted mt-1">Tanggal</p>
                </div>
                <div id="progressContainer" class="text-right hidden">
                    <span class="text-xs font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full"><span id="completedCount">0</span> / <span id="totalCount">0</span> Selesai</span>
                </div>
            </div>

            <!-- Area List Kosong -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
                <i class="ph-duotone ph-coffee text-6xl text-gray-300 mb-4"></i>
                <h3 class="text-lg font-medium text-gray-600">Jadwal masih kosong</h3>
                <p class="text-sm text-gray-400 mt-2 max-w-xs">Mulai tambahkan rutinitas atau hobimu hari ini di form sebelah kiri.</p>
            </div>

            <!-- Container List Jadwal -->
            <div id="taskList" class="flex flex-col gap-4 relative pb-20 md:pb-0">
                <!-- Garis vertikal timeline -->
                <div class="absolute left-[38px] top-4 bottom-4 w-px bg-gray-200 z-0"></div>
                
                <!-- Item jadwal akan di-generate di sini via JS -->
            </div>

        </div>
    </div>

    <script>
        // Konfigurasi Kategori (Warna & Icon)
        const categoryConfig = {
            rutinitas: { color: 'bg-catRutinitas', icon: 'ph-arrows-clockwise' },
            hobi:      { color: 'bg-catHobi',      icon: 'ph-palette' },
            penting:   { color: 'bg-catPenting',   icon: 'ph-star' },
            santai:    { color: 'bg-catSantai',    icon: 'ph-coffee' }
        };

        // State Aplikasi
        let tasks = JSON.parse(localStorage.getItem('pudyy_schedules')) || [];

        // DOM Elements
        const taskForm = document.getElementById('taskForm');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const currentDateEl = document.getElementById('currentDate');
        const greetingTextEl = document.getElementById('greetingText');
        const progressContainer = document.getElementById('progressContainer');
        const completedCountEl = document.getElementById('completedCount');
        const totalCountEl = document.getElementById('totalCount');

        // Setup Tanggal & Waktu
        function setupDateAndGreeting() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            currentDateEl.textContent = now.toLocaleDateString('id-ID', options);

            const hour = now.getHours();
            let greeting = "Selamat malam,";
            if (hour >= 5 && hour < 11) greeting = "Selamat pagi,";
            else if (hour >= 11 && hour < 15) greeting = "Selamat siang,";
            else if (hour >= 15 && hour < 18) greeting = "Selamat sore,";

            greetingTextEl.textContent = `${greeting} semoga harimu menyenangkan!`;
        }

        // Format waktu (09:00)
        function formatTime(timeStr) {
            return timeStr; // Input type time sudah mengembalikan format HH:MM
        }

        // Simpan ke LocalStorage
        function saveTasks() {
            localStorage.setItem('pudyy_schedules', JSON.stringify(tasks));
            renderTasks();
        }

        // Tambah Jadwal Baru
        taskForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('taskName').value;
            const time = document.getElementById('taskTime').value;
            const category = document.querySelector('input[name="category"]:checked').value;

            const newTask = {
                id: Date.now().toString(),
                name: name,
                time: time,
                category: category,
                completed: false
            };

            tasks.push(newTask);
            
            // Urutkan berdasarkan waktu
            tasks.sort((a, b) => a.time.localeCompare(b.time));
            
            saveTasks();
            taskForm.reset();
            // Kembalikan radio button ke default
            document.querySelector('input[name="category"][value="rutinitas"]').checked = true;
        });

        // Hapus Jadwal
        function deleteTask(id) {
            // Animasi hilang
            const el = document.getElementById(`task-${id}`);
            el.style.opacity = '0';
            el.style.transform = 'translateX(20px)';
            
            setTimeout(() => {
                tasks = tasks.filter(task => task.id !== id);
                saveTasks();
            }, 300); // Sesuaikan dengan durasi transisi
        }

        // Toggle Status Selesai
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
            }
        }

        // Render List Jadwal ke HTML
        function renderTasks() {
            taskList.innerHTML = '<div class="absolute left-[38px] top-4 bottom-4 w-px bg-gray-200 z-0 hidden md:block"></div>'; // Reset & tambahkan garis
            
            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                progressContainer.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                progressContainer.classList.remove('hidden');
                
                const completedCount = tasks.filter(t => t.completed).length;
                completedCountEl.textContent = completedCount;
                totalCountEl.textContent = tasks.length;

                tasks.forEach((task, index) => {
                    const config = categoryConfig[task.category];
                    const isDone = task.completed;
                    
                    const taskHTML = `
                        <div id="task-${task.id}" class="task-item z-10 flex gap-4 items-center group transition-all duration-300 ${isDone ? 'opacity-60' : ''}">
                            
                            <!-- Area Waktu & Bullet Timeline -->
                            <div class="flex flex-col items-center min-w-[75px] shrink-0">
                                <div class="text-sm font-semibold ${isDone ? 'text-gray-400 line-through' : 'text-gray-700'}">${task.time}</div>
                                <div class="w-4 h-4 rounded-full border-4 border-white shadow-sm mt-1 z-10 ${config.color} ${isDone ? 'ring-2 ring-gray-200 grayscale' : ''}"></div>
                            </div>

                            <!-- Card Konten -->
                            <div class="flex-grow bg-cardBg rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between gap-3 hover:shadow-md transition-shadow relative overflow-hidden">
                                
                                ${isDone ? '<div class="absolute inset-0 bg-gray-50/50 z-0"></div>' : ''}
                                
                                <!-- Info Kegiatan -->
                                <div class="flex items-center gap-3 z-10 w-full">
                                    <!-- Icon Kategori -->
                                    <div class="w-10 h-10 rounded-xl ${config.color} flex items-center justify-center shrink-0 ${isDone ? 'grayscale' : ''}">
                                        <i class="ph ${config.icon} text-gray-700 text-lg"></i>
                                    </div>
                                    
                                    <div class="flex-grow">
                                        <h3 class="text-sm font-medium ${isDone ? 'text-gray-400 line-through' : 'text-gray-800'}">${task.name}</h3>
                                        <span class="text-[10px] uppercase tracking-wider font-semibold text-gray-500">${task.category}</span>
                                    </div>
                                </div>

                                <!-- Aksi (Ceklis & Hapus) -->
                                <div class="flex items-center gap-2 z-10 shrink-0">
                                    <button onclick="toggleTask('${task.id}')" class="w-8 h-8 rounded-full flex items-center justify-center transition-colors ${isDone ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-400 hover:bg-green-50 hover:text-green-500'}">
                                        <i class="ph-bold ph-check"></i>
                                    </button>
                                    
                                    <button onclick="deleteTask('${task.id}')" class="w-8 h-8 rounded-full flex items-center justify-center bg-gray-100 text-gray-400 hover:bg-red-50 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100 md:opacity-0 max-md:opacity-100">
                                        <i class="ph-bold ph-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    taskList.insertAdjacentHTML('beforeend', taskHTML);
                });
            }
        }

        // Inisialisasi awal
        setupDateAndGreeting();
        renderTasks();

        // Update sapaan setiap menit agar dinamis
        setInterval(setupDateAndGreeting, 60000);

    </script>
</body>
</html>
